services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
    # Keep MySQL in UTC so created_at/closed_at math matches Go's UTC times.
    command: --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      SERVER_PORT: "8080"
      MYSQL_DSN: "taskuser:taskpass@tcp(mysql:3306)/taskdb?parseTime=true&charset=utf8mb4&loc=UTC"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRY: "24h"
      CACHE_TTL: "5m"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
