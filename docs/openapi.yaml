openapi: 3.0.3
info:
  title: Task Manager API
  description: REST API для управления задачами внутри команд (ролевая модель, история, кеш, отчёт).
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный запуск

tags:
  - name: auth
  - name: teams
  - name: tasks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    DataEnvelope:
      type: object
      description: Общая обёртка ответов.
      properties:
        data:
          type: object

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Team:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [todo, in_progress, done] }
        created_by: { type: integer, format: int64 }
        assignee_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }

    Change:
      type: object
      properties:
        field: { type: string }
        old: {}
        new: {}

    TaskHistory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        changed_by: { type: integer, format: int64 }
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        created_at: { type: string, format: date-time }

    TaskComment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        content: { type: string }
        created_at: { type: string, format: date-time }

    TopAssignee:
      type: object
      properties:
        assignee_id: { type: integer, format: int64 }
        name: { type: string }
        closed_count: { type: integer }

    TeamStats:
      type: object
      properties:
        status_counts:
          type: object
          additionalProperties: { type: integer }
        top_assignees:
          type: array
          items: { $ref: '#/components/schemas/TopAssignee' }
        avg_close_seconds: { type: number }
        total_comments: { type: integer }

  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, name]
            properties:
              email: { type: string }
              password: { type: string }
              name: { type: string }
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string }
              password: { type: string }
    CreateTeam:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
    Invite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_id, role]
            properties:
              user_id: { type: integer, format: int64 }
              role: { type: string, enum: [admin, member] }
    CreateTask:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [team_id, title]
            properties:
              team_id: { type: integer, format: int64 }
              title: { type: string }
              description: { type: string }
              assignee_id: { type: integer, format: int64, nullable: true }
    UpdateTask:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              status: { type: string, enum: [todo, in_progress, done] }
              assignee_id: { type: integer, format: int64, nullable: true }
    AddComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string }

  responses:
    Unauthorized:
      description: Не передан или невалиден JWT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточно прав.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Конфликт (дубликат, оптимистичная блокировка).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Превышен лимит запросов (rate limit).
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [auth]
      security: []
      summary: Регистрация пользователя
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201':
          description: Пользователь создан, выдан JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '400': { $ref: '#/components/responses/Conflict' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /login:
    post:
      tags: [auth]
      security: []
      summary: Аутентификация, выдача JWT
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200':
          description: Успешный вход.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /teams:
    post:
      tags: [teams]
      summary: Создание команды (текущий пользователь становится owner)
      requestBody: { $ref: '#/components/requestBodies/CreateTeam' }
      responses:
        '201':
          description: Команда создана.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [teams]
      summary: Список команд текущего пользователя
      responses:
        '200':
          description: Массив команд.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }

  /teams/{id}/invite:
    post:
      tags: [teams]
      summary: Добавление пользователя в команду / смена роли (owner или admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody: { $ref: '#/components/requestBodies/Invite' }
      responses:
        '200':
          description: Приглашение выполнено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{team_id}/stats:
    get:
      tags: [teams]
      summary: SQL-отчёт по команде (только owner/admin)
      parameters:
        - name: team_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Отчёт.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TeamStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks:
    post:
      tags: [tasks]
      summary: Создание задачи в команде
      requestBody: { $ref: '#/components/requestBodies/CreateTask' }
      responses:
        '201':
          description: Задача создана.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Forbidden' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [tasks]
      summary: Список задач команды с фильтрами и курсорной пагинацией
      parameters:
        - name: team_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, done] }
        - name: assignee_id
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: cursor
          in: query
          description: ID последнего элемента предыдущей страницы (keyset-пагинация).
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Страница задач и курсор следующей страницы.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items: { $ref: '#/components/schemas/Task' }
                      next_cursor:
                        type: integer
                        format: int64
                        nullable: true
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tasks/{id}:
    put:
      tags: [tasks]
      summary: Обновление задачи с проверкой прав и записью истории
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody: { $ref: '#/components/requestBodies/UpdateTask' }
      responses:
        '200':
          description: Задача обновлена.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/history:
    get:
      tags: [tasks]
      summary: История изменений задачи
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Массив записей истории.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaskHistory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/comments:
    post:
      tags: [tasks]
      summary: Добавление комментария к задаче
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody: { $ref: '#/components/requestBodies/AddComment' }
      responses:
        '201':
          description: Комментарий создан.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TaskComment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [tasks]
      summary: Список комментариев задачи
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Массив комментариев.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaskComment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
